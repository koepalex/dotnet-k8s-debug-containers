name: Build sample application and symbols

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/sample-app

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application image and symbols
        id: bake
        uses: docker/bake-action@v7
        with:
          source: .
          files: ./examples/sample-app/docker-bake.hcl
          targets: runtime,symbols
          pull: true
          provenance: false
          vars: |
            IMAGE_NAME=${{ env.IMAGE_NAME }}
            IMAGE_TAG=sha-${{ github.sha }}
            SOURCE_REVISION_ID=${{ github.sha }}
            SYMBOLS_OUTPUT=./artifacts/sample-app/symbols
          set: |
            runtime.output=type=image,push=${{ github.event_name != 'pull_request' }}

      - name: Package symbol bundle
        id: symbols
        shell: pwsh
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          $metadata = $env:BAKE_METADATA | ConvertFrom-Json
          $imageDigest = $metadata.runtime.'containerimage.digest'
          if (-not $imageDigest) {
              throw 'The application image digest was not returned by Buildx.'
          }

          $symbolsDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/sample-app/symbols'
          $pdbFiles = @(Get-ChildItem -Path $symbolsDirectory -Filter '*.pdb' -File)
          if ($pdbFiles.Count -eq 0) {
              throw 'The symbols target did not export any portable PDB files.'
          }

          $pdbs = @($pdbFiles | Sort-Object Name | ForEach-Object {
              [ordered]@{
                  fileName = $_.Name
                  sha256 = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
          })

          $manifest = [ordered]@{
              schemaVersion = 1
              repository = '${{ github.repository }}'
              commitSha = '${{ github.sha }}'
              configuration = 'Release'
              targetFramework = 'net10.0'
              image = "$env:IMAGE_NAME`:sha-${{ github.sha }}"
              imageDigest = $imageDigest
              sourceRoot = '/_/src'
              modules = @('SampleApp.dll')
              pdbs = $pdbs
          }

          $manifestPath = Join-Path $symbolsDirectory 'symbols-manifest.json'
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path $manifestPath -Encoding utf8NoBOM

          $shortSha = '${{ github.sha }}'.Substring(0, 12)
          $bundlePath = Join-Path $env:GITHUB_WORKSPACE "artifacts/sample-app/sample-app-symbols-$shortSha.zip"
          Compress-Archive -Path (Join-Path $symbolsDirectory '*') -DestinationPath $bundlePath

          "bundle-path=$bundlePath" >> $env:GITHUB_OUTPUT
          "bundle-name=sample-app-symbols-$shortSha" >> $env:GITHUB_OUTPUT

      - name: Upload symbols artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.symbols.outputs.bundle-name }}
          path: ${{ steps.symbols.outputs.bundle-path }}
          if-no-files-found: error

      - name: Add version tag to application image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}"

      - name: Publish symbols as a release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseName = 'sample-app-symbols-${{ github.ref_name }}.zip'
          $releasePath = Join-Path $env:RUNNER_TEMP $releaseName
          Copy-Item '${{ steps.symbols.outputs.bundle-path }}' $releasePath

          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -ne 0) {
              gh release create '${{ github.ref_name }}' --verify-tag --generate-notes
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not create GitHub Release '${{ github.ref_name }}'."
              }
          }

          gh release upload '${{ github.ref_name }}' $releasePath --clobber
          if ($LASTEXITCODE -ne 0) {
              throw "Could not upload symbols to GitHub Release '${{ github.ref_name }}'."
          }
